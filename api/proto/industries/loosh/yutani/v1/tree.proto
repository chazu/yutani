syntax = "proto3";

package industries.loosh.yutani.v1;

option go_package = "github.com/chazu/yutani/pkg/proto/yutani";

import "industries/loosh/yutani/v1/types.proto";

// TreeService provides operations for TreeView widgets
service TreeService {
  // Set the root node
  rpc SetRoot(SetTreeRootRequest) returns (SetTreeRootResponse);

  // Add a child node
  rpc AddChild(AddTreeChildRequest) returns (AddTreeChildResponse);

  // Remove a node
  rpc RemoveNode(RemoveTreeNodeRequest) returns (RemoveTreeNodeResponse);

  // Expand or collapse a node
  rpc SetExpanded(TreeSetExpandedRequest) returns (TreeSetExpandedResponse);

  // Get the currently selected node
  rpc GetSelection(TreeGetSelectionRequest) returns (TreeGetSelectionResponse);

  // Set the selected node
  rpc SetSelection(TreeSetSelectionRequest) returns (TreeSetSelectionResponse);

  // Get a node's children
  rpc GetChildren(TreeGetChildrenRequest) returns (TreeGetChildrenResponse);
}

// Tree node identifier
message TreeNodeId {
  string id = 1;
}

// Tree node definition
message TreeNode {
  string text = 1;
  optional Color color = 2;
  optional bool selectable = 3;
  optional bool expanded = 4;
  optional string reference = 5;  // Application-specific reference
}

// SetRoot

message SetTreeRootRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  TreeNode node = 3;
}

message SetTreeRootResponse {
  bool success = 1;
  TreeNodeId node_id = 2;
}

// AddChild

message AddTreeChildRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  TreeNodeId parent_id = 3;
  TreeNode node = 4;
}

message AddTreeChildResponse {
  bool success = 1;
  TreeNodeId node_id = 2;
}

// RemoveNode

message RemoveTreeNodeRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  TreeNodeId node_id = 3;
}

message RemoveTreeNodeResponse {
  bool success = 1;
}

// SetExpanded

message TreeSetExpandedRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  TreeNodeId node_id = 3;
  bool expanded = 4;
}

message TreeSetExpandedResponse {
  bool success = 1;
}

// GetSelection

message TreeGetSelectionRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
}

message TreeGetSelectionResponse {
  TreeNodeId node_id = 1;
  string text = 2;
  string reference = 3;
}

// SetSelection

message TreeSetSelectionRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  TreeNodeId node_id = 3;
}

message TreeSetSelectionResponse {
  bool success = 1;
}

// GetChildren

message TreeGetChildrenRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  TreeNodeId node_id = 3;
}

message TreeGetChildrenResponse {
  repeated TreeNodeInfo children = 1;
}

message TreeNodeInfo {
  TreeNodeId node_id = 1;
  string text = 2;
  string reference = 3;
  bool expanded = 4;
}
