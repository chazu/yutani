syntax = "proto3";

package industries.loosh.yutani.v1;

option go_package = "github.com/chazu/yutani/pkg/proto/yutani";

import "industries/loosh/yutani/v1/types.proto";

// FormService provides operations for Form widgets
service FormService {
  // Add a form field (InputField, Checkbox, DropDown, etc.)
  rpc AddField(FormAddFieldRequest) returns (FormAddFieldResponse);

  // Add a button to the form
  rpc AddButton(FormAddButtonRequest) returns (FormAddButtonResponse);

  // Get a field's value
  rpc GetFieldValue(FormGetFieldValueRequest) returns (FormGetFieldValueResponse);

  // Set a field's value
  rpc SetFieldValue(FormSetFieldValueRequest) returns (FormSetFieldValueResponse);

  // Clear all form fields
  rpc Clear(FormClearRequest) returns (FormClearResponse);

  // Get the number of form items
  rpc GetItemCount(FormGetItemCountRequest) returns (FormGetItemCountResponse);
}

// Form field types
enum FormFieldType {
  FORM_FIELD_INPUT = 0;
  FORM_FIELD_PASSWORD = 1;
  FORM_FIELD_CHECKBOX = 2;
  FORM_FIELD_DROPDOWN = 3;
}

// AddField

message FormAddFieldRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  string label = 3;
  FormFieldType field_type = 4;
  optional int32 field_width = 5;
  optional string initial_value = 6;
  repeated string dropdown_options = 7;  // For dropdown fields
}

message FormAddFieldResponse {
  bool success = 1;
  int32 field_index = 2;
}

// AddButton

message FormAddButtonRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  string label = 3;
}

message FormAddButtonResponse {
  bool success = 1;
  int32 button_index = 2;
}

// GetFieldValue

message FormGetFieldValueRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  int32 field_index = 3;
}

message FormGetFieldValueResponse {
  string value = 1;
}

// SetFieldValue

message FormSetFieldValueRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  int32 field_index = 3;
  string value = 4;
}

message FormSetFieldValueResponse {
  bool success = 1;
}

// Clear

message FormClearRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
}

message FormClearResponse {
  bool success = 1;
}

// GetItemCount

message FormGetItemCountRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
}

message FormGetItemCountResponse {
  int32 count = 1;
}
