syntax = "proto3";

package industries.loosh.yutani.v1;

option go_package = "github.com/chazu/yutani/pkg/proto/yutani";

// Core geometric types

message Position {
  int32 x = 1;
  int32 y = 2;
}

message Size {
  int32 width = 1;
  int32 height = 2;
}

message Rect {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

// Color and style types

message Color {
  oneof color {
    string name = 1;      // Named color: "red", "blue", etc.
    int32 index = 2;      // 256-color palette index
    RGB rgb = 3;          // True color
  }
}

message RGB {
  int32 r = 1;
  int32 g = 2;
  int32 b = 3;
}

message Style {
  Color foreground = 1;
  Color background = 2;
  repeated Attribute attributes = 3;
}

enum Attribute {
  ATTR_NONE = 0;
  ATTR_BOLD = 1;
  ATTR_ITALIC = 2;
  ATTR_UNDERLINE = 3;
  ATTR_REVERSE = 4;
  ATTR_BLINK = 5;
  ATTR_DIM = 6;
  ATTR_STRIKETHROUGH = 7;
}

message Cell {
  string rune = 1;        // UTF-8 character
  Style style = 2;
}

// Session and Widget identifiers

message SessionId {
  string id = 1;
}

message WidgetId {
  string id = 1;
}

// Widget types and properties

enum WidgetType {
  WIDGET_BOX = 0;
  WIDGET_TEXT_VIEW = 1;
  WIDGET_INPUT_FIELD = 2;
  WIDGET_TEXT_AREA = 3;
  WIDGET_BUTTON = 4;
  WIDGET_CHECKBOX = 5;
  WIDGET_DROPDOWN = 6;
  WIDGET_LIST = 7;
  WIDGET_TABLE = 8;
  WIDGET_TREE_VIEW = 9;
  WIDGET_FORM = 10;
  WIDGET_FLEX = 11;
  WIDGET_GRID = 12;
  WIDGET_PAGES = 13;
  WIDGET_MODAL = 14;
  WIDGET_IMAGE = 15;
  WIDGET_PROGRESS_BAR = 16;
  WIDGET_WINDOW = 17;
  WIDGET_WINDOW_MANAGER = 18;
  WIDGET_MENU_BAR = 20;
  WIDGET_MENU = 21;
  WIDGET_MENU_ITEM = 22;
}

enum Alignment {
  ALIGN_LEFT = 0;
  ALIGN_CENTER = 1;
  ALIGN_RIGHT = 2;
}

message Padding {
  int32 top = 1;
  int32 bottom = 2;
  int32 left = 3;
  int32 right = 4;
}

// Widget properties

message WidgetProperties {
  // Common properties (from Box)
  optional Rect rect = 1;
  optional bool border = 2;
  optional string title = 3;
  optional Alignment title_align = 4;
  optional Color background_color = 5;
  optional Color border_color = 6;
  optional Color title_color = 7;
  optional Padding padding = 8;

  // Type-specific properties
  oneof type_properties {
    TextViewProperties text_view = 20;
    InputFieldProperties input_field = 21;
    ButtonProperties button = 22;
    CheckboxProperties checkbox = 23;
    DropdownProperties dropdown = 24;
    ListProperties list = 25;
    TableProperties table = 26;
    FlexProperties flex = 27;
    GridProperties grid = 28;
    TreeProperties tree = 29;
    FormProperties form = 30;
    PagesProperties pages = 31;
    TextAreaProperties text_area = 32;
    ModalProperties modal = 33;
    ImageProperties image = 34;
    ProgressBarProperties progress_bar = 35;
    WindowProperties window = 36;
    WindowManagerProperties window_manager = 37;
    MenuBarProperties menu_bar = 40;
    MenuProperties menu = 41;
    MenuItemProperties menu_item = 42;
  }
}

// Widget-specific property messages

message TextViewProperties {
  optional string text = 1;
  optional bool dynamic_colors = 2;
  optional bool word_wrap = 3;
  optional bool scrollable = 4;
  optional int32 max_lines = 5;
  optional Color text_color = 6;
}

message InputFieldProperties {
  optional string label = 1;
  optional string placeholder = 2;
  optional string text = 3;
  optional int32 field_width = 4;
  optional bool masked = 5;
  optional string mask_character = 6;
  optional Color label_color = 7;
  optional Color field_text_color = 8;
  optional Color field_background_color = 9;
}

message ButtonProperties {
  optional string label = 1;
  optional Color label_color = 2;
  optional Color background_color = 3;
  optional Color activated_color = 4;
}

message CheckboxProperties {
  optional string label = 1;
  optional bool checked = 2;
  optional Color label_color = 3;
  optional Color checked_color = 4;
}

message DropdownProperties {
  repeated string options = 1;
  optional int32 selected_index = 2;
  optional string selected_text = 3;
  optional Color label_color = 4;
  optional Color field_background_color = 5;
  optional Color field_text_color = 6;
  optional string label = 7;
  optional int32 field_width = 8;
}

message ListProperties {
  optional bool show_secondary_text = 1;
  optional Color main_text_color = 2;
  optional Color secondary_text_color = 3;
  optional Color selected_text_color = 4;
  optional Color selected_background_color = 5;
}

message TableProperties {
  optional bool borders = 1;
  optional bool fixed_columns = 2;
  optional bool selectable = 3;
  optional Color borders_color = 4;
}

message FlexProperties {
  optional FlexDirection direction = 1;
  optional bool full_screen = 2;
}

enum FlexDirection {
  FLEX_ROW = 0;
  FLEX_COLUMN = 1;
}

message GridProperties {
  optional int32 rows = 1;
  optional int32 columns = 2;
  optional int32 min_width = 3;
  optional int32 min_height = 4;
}

message TreeProperties {
  optional Color node_text_color = 1;
  optional Color selected_text_color = 2;
  optional Color selected_background_color = 3;
  optional string top_level_prefix = 4;
  optional bool show_graphics = 5;
}

message FormProperties {
  optional int32 label_width = 1;
  optional int32 field_width = 2;
  optional Color label_color = 3;
  optional Color field_text_color = 4;
  optional Color field_background_color = 5;
  optional Color button_background_color = 6;
  optional Color button_text_color = 7;
  optional bool horizontal = 8;
}

message PagesProperties {
  optional bool show_page_names = 1;
  optional Color page_name_color = 2;
}

message TextAreaProperties {
  optional string text = 1;
  optional string placeholder = 2;
  optional int32 max_length = 3;
  optional bool word_wrap = 4;
  optional Color text_color = 5;
  optional Color placeholder_color = 6;
  // Keys that should be suppressed from widget processing but still emitted as events.
  // Format: "ctrl+d", "ctrl+p", "ctrl+i", "ctrl+space", etc.
  repeated string suppressed_keys = 7;
}

message ModalProperties {
  optional string text = 1;
  repeated string buttons = 2;
  optional Color text_color = 3;
  optional Color background_color = 4;
  optional Color button_background_color = 5;
  optional Color button_text_color = 6;
}

message ImageProperties {
  optional bytes image_data = 1;
  optional string image_path = 2;
  optional int32 colors = 3;
  optional bool dithering = 4;
  optional ImageAspectRatio aspect_ratio = 5;
}

enum ImageAspectRatio {
  IMAGE_ASPECT_NONE = 0;
  IMAGE_ASPECT_PRESERVE = 1;
}

message ProgressBarProperties {
  optional int32 progress = 1;         // 0-100
  optional int32 max = 2;              // Maximum value (default 100)
  optional string label = 3;           // Optional label
  optional bool show_percentage = 4;   // Show percentage text
  optional Color filled_color = 5;
  optional Color empty_color = 6;
  optional string filled_char = 7;     // Character for filled portion
  optional string empty_char = 8;      // Character for empty portion
}

// Window state enum
enum WindowState {
  WINDOW_NORMAL = 0;
  WINDOW_MAXIMIZED = 1;
  WINDOW_MINIMIZED = 2;
}

// WindowProperties configures a Window widget
message WindowProperties {
  optional Rect initial_rect = 1;
  optional WindowState state = 2;
  optional bool resizable = 3;
  optional bool movable = 4;
  optional bool closable = 5;
  optional bool minimizable = 6;
  optional bool maximizable = 7;
  optional int32 min_width = 8;
  optional int32 min_height = 9;
  optional int32 max_width = 10;
  optional int32 max_height = 11;
  optional Color title_bar_color = 12;
  optional Color title_bar_text_color = 13;
  optional Color active_border_color = 14;
  optional Color inactive_border_color = 15;
}

// WindowManagerProperties configures a WindowManager widget
message WindowManagerProperties {
  optional Color background_color = 1;
}

// Menu widget properties

message MenuBarProperties {
  optional Color background_color = 1;
  optional Color text_color = 2;
  optional Color active_background_color = 3;
  optional Color active_text_color = 4;
}

message MenuProperties {
  optional string title = 1;
}

message MenuItemProperties {
  optional string label = 1;
  optional string shortcut_display = 2;  // e.g., "Ctrl+N" — display only, not functional
  optional bool separator = 3;           // if true, renders as a divider line
  optional bool disabled = 4;
}

// Key and modifier enums for events (Phase 2)

enum Key {
  KEY_RUNE = 0;              // Regular character (check rune field)
  KEY_UP = 1;
  KEY_DOWN = 2;
  KEY_LEFT = 3;
  KEY_RIGHT = 4;
  KEY_ENTER = 5;
  KEY_ESCAPE = 6;
  KEY_TAB = 7;
  KEY_BACKTAB = 8;
  KEY_BACKSPACE = 9;
  KEY_DELETE = 10;
  KEY_INSERT = 11;
  KEY_HOME = 12;
  KEY_END = 13;
  KEY_PGUP = 14;
  KEY_PGDN = 15;
  KEY_F1 = 16;
  KEY_F2 = 17;
  KEY_F3 = 18;
  KEY_F4 = 19;
  KEY_F5 = 20;
  KEY_F6 = 21;
  KEY_F7 = 22;
  KEY_F8 = 23;
  KEY_F9 = 24;
  KEY_F10 = 25;
  KEY_F11 = 26;
  KEY_F12 = 27;
}

enum Modifier {
  MOD_NONE = 0;
  MOD_SHIFT = 1;
  MOD_CTRL = 2;
  MOD_ALT = 3;
  MOD_META = 4;
  MOD_HYPER = 5;
}

// Mouse button enum for mouse events
enum MouseButton {
  MOUSE_NONE = 0;
  MOUSE_PRIMARY = 1;      // Left button (Button1)
  MOUSE_SECONDARY = 2;    // Right button (Button2)
  MOUSE_MIDDLE = 3;       // Middle button (Button3)
  MOUSE_WHEEL_UP = 4;
  MOUSE_WHEEL_DOWN = 5;
  MOUSE_WHEEL_LEFT = 6;
  MOUSE_WHEEL_RIGHT = 7;
}

