syntax = "proto3";

package industries.loosh.yutani.v1;

option go_package = "github.com/chazu/yutani/pkg/proto/yutani";

import "industries/loosh/yutani/v1/types.proto";

// ListService provides operations for List widgets
service ListService {
  // Add an item to the list
  rpc AddItem(ListAddItemRequest) returns (ListAddItemResponse);

  // Remove an item from the list
  rpc RemoveItem(ListRemoveItemRequest) returns (ListRemoveItemResponse);

  // Clear all items from the list
  rpc Clear(ListClearRequest) returns (ListClearResponse);

  // Get the number of items in the list
  rpc GetItemCount(ListGetItemCountRequest) returns (ListGetItemCountResponse);

  // Get the currently selected item index
  rpc GetSelection(ListGetSelectionRequest) returns (ListGetSelectionResponse);

  // Set the selected item index
  rpc SetSelection(ListSetSelectionRequest) returns (ListSetSelectionResponse);

  // Get an item's text
  rpc GetItem(ListGetItemRequest) returns (ListGetItemResponse);
}

// AddItem

message ListAddItemRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  string main_text = 3;
  string secondary_text = 4;
  optional string shortcut = 5;
}

message ListAddItemResponse {
  bool success = 1;
  int32 index = 2;  // Index of the added item
}

// RemoveItem

message ListRemoveItemRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  int32 index = 3;
}

message ListRemoveItemResponse {
  bool success = 1;
}

// Clear

message ListClearRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
}

message ListClearResponse {
  bool success = 1;
}

// GetItemCount

message ListGetItemCountRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
}

message ListGetItemCountResponse {
  int32 count = 1;
}

// GetSelection

message ListGetSelectionRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
}

message ListGetSelectionResponse {
  int32 index = 1;  // -1 if no selection
}

// SetSelection

message ListSetSelectionRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  int32 index = 3;
}

message ListSetSelectionResponse {
  bool success = 1;
}

// GetItem

message ListGetItemRequest {
  SessionId session_id = 1;
  WidgetId widget_id = 2;
  int32 index = 3;
}

message ListGetItemResponse {
  string main_text = 1;
  string secondary_text = 2;
  string shortcut = 3;
}
